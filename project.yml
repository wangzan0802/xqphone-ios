name: XQPhone
options:
  bundleIdPrefix: com.tsss
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true

targets:
  XQPhone:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources
      - path: Resources/LaunchScreen.storyboard
        buildPhase: resources
      - path: www
        type: folder          # 目录引用，整体拷进 .app/www，保留相对路径
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsss.phone
        PRODUCT_NAME: XQPhone
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "100"
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "12.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        ONLY_ACTIVE_ARCH: "NO"
        ARCHS: "arm64"
